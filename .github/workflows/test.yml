name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Security Audit (OWASP)
      run: npm audit --audit-level=high || true # Warn on vulnerabilities but don't fail yet
      
    - name: Run Unit & Integration Tests (Vitest)
      run: npx vitest run
      
    - name: Build Application
      run: npm run build
      
    - name: Run Performance & Accessibility Tests (Lighthouse CI)
      run: |
        npm install -g @lhci/cli
        lhci autorun --collect.staticDistDir="./dist" --upload.target="temporary-public-storage" || true
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run E2E, Cross-Browser & Accessibility Tests (Playwright)
      run: npx playwright test
      
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
