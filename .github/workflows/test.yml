name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  migrations:
    name: Fresh database from migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4

    - uses: supabase/setup-cli@v1
      with:
        version: 2.116.0

    - name: Build an empty database from all migrations
      run: supabase db start

    - name: Check every migration was applied
      run: |
        expected=$(ls supabase/migrations/*.sql | wc -l)
        applied=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from supabase_migrations.schema_migrations")
        echo "applied $applied of $expected migrations"
        test "$applied" -eq "$expected"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Security Audit (OWASP)
      run: npm audit --omit=dev --audit-level=high
      
    - name: Run Unit & Integration Tests (Vitest)
      run: npx vitest run
      
    - name: Check edge grading copy is in sync
      run: node scripts/edgeGrading.mjs --check

    - name: Build Application
      run: npm run build
      env:
        VITE_ALLOW_DEMO: '1'
      
    - name: Run Performance & Accessibility Tests (Lighthouse CI)
      run: |
        npm install -g @lhci/cli
        lhci autorun --collect.staticDistDir="./dist" --upload.target="temporary-public-storage" || true
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run E2E, Cross-Browser & Accessibility Tests (Playwright)
      run: npx playwright test
      
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
