[package]
name = "vignan-lockdown"
version = "0.1.0"
description = "Vignan OS — Lockdown Exam Browser"
authors = ["Vignan OS"]
edition = "2021"
rust-version = "1.77"
default-run = "vignan-lockdown"

[[bin]]
name = "vignan-watchdog"
path = "src/bin/watchdog.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2-app-kit = "0.3"
objc2 = "0.6"
sysinfo = "0.36.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
