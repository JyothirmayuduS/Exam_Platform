[package]
name = "vignan-lockdown"
version = "0.1.0"
description = "Vignan OS — Lockdown Exam Browser"
authors = ["Vignan OS"]
edition = "2021"
rust-version = "1.77"
default-run = "vignan-lockdown"

[[bin]]
name = "vignan-watchdog"
path = "src/bin/watchdog.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Apple-only kiosk APIs (NSApplication presentation options, window level).
# Target-gated so Windows/Linux builds don't compile objc2.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2 = "0.6"
block2 = "0.6"

# Windows kiosk APIs (keyboard hook, taskbar, registry policies, WebView2
# snapshot). Same versions wry already links.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
